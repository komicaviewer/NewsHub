plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
}

android {
    compileSdk 34
    defaultConfig { minSdk 29 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    namespace 'tw.kevinzhang.marketplace'
}

dependencies {
    implementation project(':extension-api')
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.okhttp.core
    implementation libs.gson
    implementation libs.androidx.core.ktx
    implementation libs.coroutines.android
    testImplementation libs.junit4
}

def productionTrustRoot = layout.projectDirectory.file('src/main/assets/extension-root.json')
tasks.register('verifyReleaseTrustRoot') {
    // The absence of the production root is an intentional release-blocking
    // state. Do not model it as a Gradle input: Gradle validates missing input
    // files before doLast and would hide the actionable security error below.
    doLast {
        def rootFile = productionTrustRoot.asFile
        if (!rootFile.isFile() || rootFile.length() == 0L) {
            throw new GradleException(
                'Release blocked: provision the reviewed production TUF root at ' +
                    'marketplace/src/main/assets/extension-root.json. Debug fixture roots are forbidden.'
            )
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.dependsOn tasks.named('verifyReleaseTrustRoot')
    }
}
