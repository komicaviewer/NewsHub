<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NewsHub — 所有討論板，一條時間軸</title>
<meta name="description" content="Android 討論板閱讀器。PTT、Komica、巴哈姆特、伊莉、Mobile01、Hacker News 集中在同一條時間軸。">
<meta name="theme-color" content="#1E2B4B">
<link rel="icon" href="img/icon.svg" type="image/svg+xml">
<meta property="og:title" content="NewsHub">
<meta property="og:description" content="所有討論板，一條時間軸。">
<meta property="og:image" content="img/timeline.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1E2B4B;
    --deep: #101A33;
    --blue: #8090FF;
    --lilac: #B3BDFF;
    --magenta: #CF5BF7;
    --text: #EEF0FF;
    --muted: #A3ABD0;
    --line: rgba(179, 189, 255, .16);
    --font: "Bricolage Grotesque", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    --wrap: min(1120px, 100% - 32px);
  }
  * { box-sizing: border-box; margin: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--navy);
    color: var(--text);
    font: 400 1.0625rem/1.7 var(--font);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  img { display: block; max-width: 100%; height: auto; }
  a { color: inherit; }
  a:focus-visible { outline: 3px solid var(--magenta); outline-offset: 4px; border-radius: 6px; }

  .wrap { width: var(--wrap); margin-inline: auto; }

  /* header */
  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding-block: 20px;
    position: relative; z-index: 2;
  }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 800; font-size: 1.25rem; letter-spacing: -.01em; }
  .brand img { width: 36px; height: 36px; }
  .top nav { display: flex; gap: 24px; font-weight: 500; }
  .top nav a { text-decoration: none; color: var(--muted); }
  .top nav a:hover { color: var(--text); }

  /* hero: the N's three strokes, scaled up to the page */
  .hero { position: relative; isolation: isolate; overflow: hidden; padding-bottom: 96px; }
  .strokes { position: absolute; inset: 0; z-index: -1; pointer-events: none; }
  .strokes i { position: absolute; top: -10%; bottom: -10%; border-radius: 999px; }
  .strokes .s1 { left: 52%; width: 9vw; max-width: 120px; background: var(--blue); opacity: .22; }
  .strokes .s3 { right: 4%; width: 9vw; max-width: 120px; background: var(--lilac); opacity: .14; }
  .strokes .s2 {
    left: 52%; width: 18vw; max-width: 240px;
    background: var(--magenta); opacity: .5;
    --skew: 24deg;
    transform-origin: top left; transform: skewX(var(--skew));
    animation: sweep 1.1s cubic-bezier(.2, .7, .2, 1) both;
  }
  @keyframes sweep { from { transform: skewX(var(--skew)) translateY(-110%); } }

  .hero-grid {
    display: grid; grid-template-columns: 1.1fr .9fr; gap: 48px; align-items: center;
    padding-top: 56px;
  }
  h1 {
    font-weight: 800;
    font-size: clamp(2.75rem, 6.4vw, 5.25rem);
    line-height: 1.08;
    letter-spacing: -.02em;
  }
  h1 span { display: block; }
  .cta { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; margin-top: 40px; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 16px 28px; border-radius: 999px;
    background: var(--text); color: var(--deep);
    font-weight: 800; font-size: 1.125rem; text-decoration: none;
    transition: background .15s;
  }
  .btn:hover { background: var(--lilac); }
  .btn svg { width: 20px; height: 20px; }
  .ghost { color: var(--muted); font-weight: 500; text-decoration-thickness: 1px; text-underline-offset: 5px; }
  .ghost:hover { color: var(--text); }
  .req { margin-top: 20px; color: var(--muted); font-size: .9375rem; }

  /* phone frame */
  .phone {
    background: var(--deep);
    border: 10px solid #0A1022;
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 40px 80px -30px rgba(5, 8, 20, .8);
  }
  .phone img { width: 100%; aspect-ratio: 600 / 1241; object-fit: cover; object-position: top; }
  .hero .phone { width: min(360px, 100%); justify-self: center; }

  /* sources */
  .sources { background: var(--deep); padding-block: 40px; }
  .sources ul {
    list-style: none; padding: 0;
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 24px 32px;
  }
  .sources li { display: flex; align-items: center; gap: 12px; font-weight: 500; white-space: nowrap; }
  .sources img { width: 40px; height: 40px; border-radius: 10px; object-fit: contain; }

  /* features */
  section h2 {
    font-weight: 800;
    font-size: clamp(1.75rem, 3.6vw, 2.75rem);
    line-height: 1.2;
    letter-spacing: -.01em;
  }
  section p.lede { margin-top: 12px; color: var(--muted); max-width: 30em; }

  .read { padding-block: 120px; }
  .read-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px 96px; }
  .read-item .phone { width: min(320px, 100%); margin-bottom: 36px; }
  .read-item:nth-child(2) { margin-top: 160px; }

  .ext { background: var(--deep); padding-block: 120px; position: relative; overflow: hidden; }
  .ext-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 64px; align-items: center; }
  .stack { position: relative; height: 640px; }
  .stack .phone { position: absolute; width: 300px; }
  .stack .phone:first-child { left: 0; top: 0; }
  .stack .phone:last-child { left: 200px; top: 80px; border-color: #050914; }

  .end { padding-block: 128px; text-align: center; }
  .end img { width: 96px; height: 96px; margin: 0 auto 32px; }
  .end .cta { justify-content: center; }

  footer { border-top: 1px solid var(--line); padding-block: 28px; color: var(--muted); font-size: .9375rem; }
  footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; }
  footer nav { display: flex; gap: 24px; }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--text); }

  @media (max-width: 860px) {
    .hero { padding-bottom: 64px; }
    .hero-grid, .ext-grid, .read-grid { grid-template-columns: 1fr; }
    .hero-grid { padding-top: 24px; gap: 56px; }
    .strokes .s1 { left: 40%; }
    .strokes .s2 { left: 0; width: 34vw; --skew: 18deg; }
    .strokes .s1, .strokes .s3 { width: 14vw; }
    .read { padding-block: 80px; }
    .read-item:nth-child(2) { margin-top: 0; }
    .read-item .phone { margin-inline: auto; }
    .ext { padding-block: 80px; }
    .stack { height: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .stack .phone { position: static; width: auto; border-width: 6px; border-radius: 28px; }
    .sources ul { justify-content: flex-start; }
    .top nav .hide-sm { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .strokes .s2 { animation: none; }
  }
</style>
</head>
<body>

<header class="hero">
  <div class="strokes" aria-hidden="true"><i class="s1"></i><i class="s2"></i><i class="s3"></i></div>
  <div class="wrap top">
    <a class="brand" href="./"><img src="img/icon.svg" alt="" width="36" height="36">NewsHub</a>
    <nav>
      <a class="hide-sm" href="https://github.com/komicaviewer/NewsHub">GitHub</a>
      <a href="https://github.com/komicaviewer/NewsHub/blob/main/docs/third-party-extension.md">開發者</a>
    </nav>
  </div>
  <div class="wrap hero-grid">
    <div>
      <h1><span>所有討論板，</span><span>一條時間軸。</span></h1>
      <div class="cta">
        <a class="btn" href="https://github.com/komicaviewer/NewsHub/releases/latest">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14"/></svg>
          下載 APK
        </a>
        <a class="ghost" href="https://github.com/komicaviewer/NewsHub">在 GitHub 查看</a>
      </div>
      <p class="req">Android 10 以上</p>
    </div>
    <div class="phone"><img src="img/timeline.webp" width="600" height="1241" alt="NewsHub 收藏集時間軸，PTT 各看板的新文章依時間排列"></div>
  </div>
</header>

<main>
  <div class="sources">
    <ul class="wrap" aria-label="支援的討論板">
      <li><img src="img/src-ptt.webp" alt="" width="40" height="40">PTT</li>
      <li><img src="img/src-komica.webp" alt="" width="40" height="40">Komica</li>
      <li><img src="img/src-komica2.webp" alt="" width="40" height="40">Komica2</li>
      <li><img src="img/src-gamer.webp" alt="" width="40" height="40">巴哈姆特</li>
      <li><img src="img/src-eyny.webp" alt="" width="40" height="40">伊莉</li>
      <li><img src="img/src-mobile01.webp" alt="" width="40" height="40">Mobile01</li>
      <li><img src="img/src-hackernews.webp" alt="" width="40" height="40">Hacker News</li>
    </ul>
  </div>

  <section class="read">
    <div class="wrap read-grid">
      <div class="read-item">
        <div class="phone"><img src="img/boards.webp" width="600" height="1241" alt="看板目錄，Hacker News 與 Twocat 的看板可一鍵加入" loading="lazy"></div>
        <h2>挑看板，放進收藏集</h2>
        <p class="lede">不同網站的看板混在一起，按時間排好。</p>
      </div>
      <div class="read-item">
        <div class="phone"><img src="img/thread.webp" width="600" height="1241" alt="文章內頁，顯示原 PO 的貼文內容" loading="lazy"></div>
        <h2>點進去就讀</h2>
        <p class="lede">引用預覽、樹狀留言、圖片放大。</p>
      </div>
    </div>
  </section>

  <section class="ext">
    <div class="wrap ext-grid">
      <div>
        <h2>來源，由你決定</h2>
        <p class="lede">從 repo 安裝擴充套件。加入新的 repo 前，先核對它的金鑰指紋。</p>
      </div>
      <div class="stack">
        <div class="phone"><img src="img/extensions.webp" width="600" height="1241" alt="擴充套件商城，已安裝 PTT、Komica、巴哈姆特等七個來源" loading="lazy"></div>
        <div class="phone"><img src="img/repos.webp" width="600" height="1241" alt="管理來源畫面，可新增公開 HTTPS 或 GitHub private 的 extensions repo" loading="lazy"></div>
      </div>
    </div>
  </section>

  <section class="end">
    <div class="wrap">
      <img src="img/icon.svg" alt="" width="96" height="96">
      <h2>開始讀</h2>
      <div class="cta">
        <a class="btn" href="https://github.com/komicaviewer/NewsHub/releases/latest">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14"/></svg>
          下載 APK
        </a>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>NewsHub</span>
    <nav>
      <a href="https://github.com/komicaviewer/NewsHub">GitHub</a>
      <a href="https://github.com/komicaviewer/NewsHub/blob/main/docs/third-party-extension.md">開發者文件</a>
      <a href="https://github.com/komicaviewer/NewsHub/issues">回報問題</a>
    </nav>
  </div>
</footer>

</body>
</html>
