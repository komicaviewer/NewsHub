name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify-build:
    name: Verify and build unsigned APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Set version from tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          else
            echo "::error::Tag must use vMAJOR.MINOR.PATCH"; exit 1
          fi
          (( minor < 1000 && patch < 1000 ))
          code=$((major * 1000000 + minor * 1000 + patch))
          (( code >= 1 && code <= 2100000000 ))
          echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=${code}" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Test, lint, and build unsigned release APK
        run: |
          ./gradlew test lintRelease assembleRelease \
            -PAPP_VERSION_NAME="$APP_VERSION_NAME" \
            -PAPP_VERSION_CODE="$APP_VERSION_CODE"
          test -f app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newshub-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign verified APK
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: app-signing
    permissions:
      contents: read
    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: newshub-unsigned
          path: input

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Sign and verify APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_INPUT: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_INPUT: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_INPUT: ${{ secrets.KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD_INPUT KEY_ALIAS_INPUT KEY_PASSWORD_INPUT SIGNING_CERT_SHA256; do
            test -n "${!name}" || { echo "Missing ${name}" >&2; exit 1; }
          done
          build_tools=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          apksigner="$build_tools/apksigner"
          test -x "$apksigner"
          keystore="${RUNNER_TEMP}/newshub-release.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          output="newshub-${GITHUB_REF_NAME}.apk"
          "$apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS_INPUT" \
            --ks-pass env:KEYSTORE_PASSWORD_INPUT --key-pass env:KEY_PASSWORD_INPUT \
            --out "$output" input/app-release-unsigned.apk
          expected=$(printf '%s' "$SIGNING_CERT_SHA256" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          actual=$("$apksigner" verify --verbose --print-certs "$output" | \
            sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | \
            tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]')
          test -n "$actual" && test "$actual" = "$expected"

      - name: Upload signed APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: newshub-signed
          path: newshub-v*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download signed APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: newshub-signed
          path: release

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/newshub-*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
