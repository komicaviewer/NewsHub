plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
    alias(libs.plugins.hilt)
}

def prodTrustBaseUrl = 'https://raw.githubusercontent.com/komicaviewer/extensions/main'

android {
    compileSdk 34
    defaultConfig {
        minSdk 29
        def trustBaseUrl = (findProperty('newshubTrustBaseUrl') ?: prodTrustBaseUrl).toString()
        if (!(trustBaseUrl ==~ /https:\/\/[A-Za-z0-9._~\/-]+/)) throw new GradleException('Invalid newshubTrustBaseUrl')
        buildConfigField 'String', 'OFFICIAL_TRUST_BASE_URL', '"' + trustBaseUrl + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    namespace 'tw.kevinzhang.marketplace'
}

dependencies {
    implementation project(':extension-api')
    implementation libs.hilt.android
    ksp libs.hilt.compiler
    implementation libs.okhttp.core
    implementation libs.gson
    implementation libs.androidx.core.ktx
    implementation libs.coroutines.android
    testImplementation libs.junit4
}

def productionTrustRoot = layout.projectDirectory.file('src/main/assets/extension-root.json')
tasks.register('verifyReleaseEnvironment') {
    def trustBaseUrl = (findProperty('newshubTrustBaseUrl') ?: prodTrustBaseUrl).toString()
    def packageSuffix = (findProperty('newshubExtensionPackageSuffix') ?: '').toString()
    def releaseAssetDirs = android.sourceSets.getByName('release').assets.srcDirs
    def devAssets = layout.projectDirectory.dir('src/dev/assets').asFile.canonicalFile
    doLast {
        if (trustBaseUrl != prodTrustBaseUrl || packageSuffix != '' ||
                releaseAssetDirs.any { it.canonicalFile == devAssets }) {
            throw new GradleException('Release blocked: dev environment values are forbidden')
        }
    }
}

tasks.register('verifyReleaseTrustRoot') {
    // Run the JVM verifier against the exact production root, rather than only checking that a
    // non-empty file exists. This catches canonicalization or signature regressions before release.
    // Reject dev environment values first; the debug tests assert prod defaults and would mask this error.
    dependsOn 'verifyReleaseEnvironment', 'testDebugUnitTest'
    // The absence of the production root is an intentional release-blocking
    // state. Do not model it as a Gradle input: Gradle validates missing input
    // files before doLast and would hide the actionable security error below.
    doLast {
        def rootFile = productionTrustRoot.asFile
        if (!rootFile.isFile() || rootFile.length() == 0L) {
            throw new GradleException(
                'Release blocked: provision the reviewed production TUF root at ' +
                    'marketplace/src/main/assets/extension-root.json. Debug fixture roots are forbidden.'
            )
        }
    }
}

tasks.matching { it.name == 'testDebugUnitTest' }.configureEach { mustRunAfter 'verifyReleaseEnvironment' }

tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.dependsOn tasks.named('verifyReleaseTrustRoot')
    }
}
